<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192x192.png">
  
  <title>نظام الحضور الانصراف الموثوق</title>
  
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --accent: #3b82f6; --success: #22c55e; --danger: #ef4444; --border: #334155; --checkout: #0284c7; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 14px; min-height: 100vh; }
    .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h1 { font-size: 1.15rem; text-align: center; margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; outline: none; }
    input:focus { border-color: var(--accent); }
    input.locked-input { background-color: #0b1120 !important; border-color: #1e40af !important; color: #93c5fd !important; font-weight: bold; cursor: not-allowed; }
    .meta-box { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px dashed var(--accent); margin-bottom: 12px; font-size: 0.8rem; display: flex; flex-direction: column; gap: 6px; }
    .meta-item { display: flex; justify-content: space-between; align-items: center; }
    .meta-val { font-family: monospace; color: #60a5fa; font-weight: bold; }
    .status-panel { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .status-badge { display: inline-flex; align-items: center; gap: 8px; background: #0f172a; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; border: 1px solid var(--border); }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; background-color: #64748b; transition: all 0.3s ease; }
    .status-dot.active { background-color: var(--success); box-shadow: 0 0 14px var(--success); }
    .status-dot.checkout { background-color: var(--checkout); box-shadow: 0 0 14px var(--checkout); }
    .timer-display { font-size: 2.2rem; font-weight: 700; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
    #reader-container { width: 100%; min-height: 250px; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); display: none; }
    #reader { width: 100% !important; }
    .divider { display: flex; align-items: center; text-align: center; margin: 14px 0; color: var(--text-muted); font-size: 0.8rem; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
    .scanned-result-box { background: #0f172a; border: 1px solid var(--accent); border-radius: 10px; padding: 10px; margin-top: 10px; display: none; }
    .scanned-result-title { font-size: 0.8rem; color: var(--accent); font-weight: bold; margin-bottom: 4px; }
    .scanned-result-text { font-family: monospace; font-size: 0.8rem; color: #e2e8f0; word-break: break-all; background: rgba(255, 255, 255, 0.05); padding: 6px; border-radius: 6px; }
    button { width: 100%; padding: 13px; border-radius: 10px; border: none; font-size: 0.95rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-submit { background-color: #2563eb; color: white; }
    .btn-primary { background-color: var(--accent); color: white; }
    .btn-success { background-color: #16a34a; color: white; }
    .btn-danger { background-color: var(--danger); color: white; }
    .alert { padding: 12px; border-radius: 8px; font-size: 0.85rem; text-align: center; word-break: break-word; display: none; margin-bottom: 12px; }
    .alert-success { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
    .alert-error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; }
    .alert-warning { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid #eab308; }
  </style>
</head>
<body>
    <div class="container">
    <div class="card" id="identityCard">
      <h1>بيانات هوية الموظف</h1>
      <div class="meta-box">
        <div class="meta-item">
          <span>معرّف الموظف (ID):</span>
          <span class="meta-val" id="empIdDisplay">لم يتم التوليد بعد</span>
        </div>
        <div class="meta-item">
          <span>بصمة العتاد (Hardware):</span>
          <span class="meta-val" id="deviceIdDisplay" style="font-size: 0.85rem;">جاري القراءة...</span>
        </div>
      </div>
      
      <div class="form-group">
        <label for="empNameInput" id="empNameLabel">الاسم الكامل للموظف (يُدخل لمرة واحدة):</label>
        <input type="text" id="empNameInput" placeholder="أدخل اسمك الكامل هنا..." autocomplete="off">
      </div>
      
      <div class="form-group">
        <label for="empEmailInput" id="empEmailLabel">بريد الشركة الإلكتروني (@fms-tech.com):</label>
        <input type="email" id="empEmailInput" placeholder="أدخل بريدك هنا..." autocomplete="off" dir="ltr" style="text-align: left;">
      </div>

      <button type="button" class="btn-submit" id="registerBtn" onclick="handleInitialRegistration()">
        🔒 تثبيت الحساب نهائياً على هذا الهاتف
      </button>
      <div id="lockedNotice" style="display: none; font-size: 0.8rem; color: #4ade80; text-align: center; margin-top: 8px;">
        ✓ تم توثيق وتثبيت هويتك على هذا الجهاز بنجاح
      </div>
    </div>

    <div class="card status-panel">
      <div class="status-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">بانتظار التسجيل</span>
      </div>
      <div class="timer-display" id="timerDisplay">00:00:00</div>
    </div>

    <div id="alertBox" class="alert"></div>

    <div class="card">
      <h2 style="font-size: 0.95rem; margin-bottom: 12px; text-align: center; color: var(--text-muted);">
        تسجيل الحضور / الانصراف
      </h2>
      <div id="reader-container">
        <div id="reader"></div>
      </div>
      <button id="scanBtn" class="btn-primary" onclick="toggleCamera()" disabled>
        📷 تشغيل الكاميرا لمسح الرمز
      </button>
      <div class="divider">أو إدخال الرمز يدوياً</div>
      <div class="form-group" style="margin-bottom: 8px;">
        <input type="text" id="manualQrInput" placeholder="أدخل كود الـ QR المعتمد" dir="ltr" style="text-align: left;">
      </div>
      <button id="manualSubmitBtn" class="btn-success" onclick="handleManualQrSubmit()" disabled>
        ✍️ تأكيد الحضور بالكود
      </button>
      <div id="scannedResultBox" class="scanned-result-box">
        <div class="scanned-result-title">🔍 الرمز المعتمد:</div>
        <div id="scannedResultText" class="scanned-result-text">---</div>
      </div>
      <div id="lockWarning" style="font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-top: 10px;">
        (يرجى تثبيت الاسم والبريد في الأعلى أولاً)
      </div>
    </div>
    </div>
    <script>
    window.onerror = function(msg, url, line) {
      var b = document.getElementById("alertBox");
      if (b) { b.style.display = "block"; b.className = "alert alert-error"; b.innerText = "خطأ النظام: " + msg; }
      return false;
    };

    // ⚠️ لا تنسَ وضع رابط Google Apps Script الفعلي هنا بين علامتي التنصيص
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwBv-2SiU5eIBEnW0qmtez1IxNW5YVRg7bpzoa_yWyTU64rInLbOFOHZQYdFViDfB53/exec"; 
    var timerInterval = null; var html5QrCode = null; var isCameraActive = false;
    var currentEmpId = ""; var currentEmpName = ""; var currentEmpEmail = ""; var currentDeviceId = "";
    var TOLERANCE_MS = 30000; 

    function safeSetText(id, text) { var el = document.getElementById(id); if (el) el.innerText = text; }

    function generateSafeFingerprint() {
      try {
        var localUuid = localStorage.getItem("app_secure_hw_id");
        if (!localUuid) {
          localUuid = "HW-" + Math.floor(Math.random() * 900000000);
          localStorage.setItem("app_secure_hw_id", localUuid);
        }
        var w = window.screen ? window.screen.width : 0;
        var h = window.screen ? window.screen.height : 0;
        var str = localUuid + "::" + (Math.min(w, h) + "x" + Math.max(w, h)) + "::" + (navigator.hardwareConcurrency || 2);
        var hash = 0;
        for (var i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash |= 0; }
        return "HW-" + Math.abs(hash).toString(16).toUpperCase().padStart(8, '0');
      } catch (err) { return "HW-SAFE-" + Math.floor(Math.random() * 1000000); }
    }

    function initApp() {
      currentDeviceId = generateSafeFingerprint();
      safeSetText("deviceIdDisplay", currentDeviceId);
      var savedId = localStorage.getItem("emp_id");
      var savedName = localStorage.getItem("emp_name");
      var savedEmail = localStorage.getItem("emp_email");
      if (savedId && savedName && savedEmail) {
        currentEmpId = savedId; currentEmpName = savedName; currentEmpEmail = savedEmail;
        lockFieldsPermanently(currentEmpName, currentEmpEmail, currentEmpId); unlockActionButtons();
      }
      restoreWorkState();
    }
    initApp();

    function lockFieldsPermanently(name, email, id) {
      var nameInput = document.getElementById("empNameInput");
      var emailInput = document.getElementById("empEmailInput");
      var regBtn = document.getElementById("registerBtn");

      if (nameInput) { nameInput.value = name; nameInput.readOnly = true; nameInput.classList.add("locked-input"); }
      if (emailInput) { emailInput.value = email; emailInput.readOnly = true; emailInput.classList.add("locked-input"); }

      var nameLabel = document.getElementById("empNameLabel");
      if(nameLabel) nameLabel.innerHTML = 'الاسم المعتمد: <span style="color:#60a5fa;">🔒 (مقفل)</span>';
      
      var emailLabel = document.getElementById("empEmailLabel");
      if(emailLabel) emailLabel.innerHTML = 'البريد المعتمد: <span style="color:#60a5fa;">🔒 (مقفل)</span>';
      
      safeSetText("empIdDisplay", id);
      if (regBtn) regBtn.style.display = "none";
      
      var lockedNotice = document.getElementById("lockedNotice");
      if(lockedNotice) lockedNotice.style.display = "block";
    }

    function showAlert(msg, type) {
      var b = document.getElementById("alertBox");
      if (b) {
        b.innerText = msg; b.className = "alert alert-" + type; b.style.display = "block";
        setTimeout(function() { b.style.display = "none"; }, 6000);
      }
    }

    async function handleInitialRegistration() {
      var nameInput = document.getElementById("empNameInput");
      var emailInput = document.getElementById("empEmailInput");
      var regBtn = document.getElementById("registerBtn");
      
      var name = nameInput ? nameInput.value.trim() : "";
      var email = emailInput ? emailInput.value.trim().toLowerCase() : "";

      if (!name) { showAlert("يرجى إدخال اسمك الكامل", "error"); return; }
      if (!email || !email.endsWith("@fms-tech.com")) { showAlert("يجب إدخال بريد الشركة (ينتهي بـ @fms-tech.com)", "error"); return; }

      nameInput.readOnly = true; emailInput.readOnly = true; regBtn.disabled = true; regBtn.innerText = "⏳ جاري التسجيل في السيرفر...";

      var newEmpId = "EMP-" + Math.floor(100000 + Math.random() * 900000);
      var payload = { action: "REGISTER_EMPLOYEE", employeeId: newEmpId, employeeName: name, employeeEmail: email, deviceFingerprint: currentDeviceId, timestamp: new Date().toISOString() };

      try {
        var response = await fetch(SCRIPT_URL, { method: "POST", mode: "cors", body: JSON.stringify(payload), headers: { "Content-Type": "text/plain;charset=utf-8" } });
        var result = JSON.parse(await response.text());

        if (result.status === "SUCCESS" || result.status === "OK") {
          localStorage.setItem("emp_name", name); localStorage.setItem("emp_id", newEmpId); localStorage.setItem("emp_email", email);
          currentEmpName = name; currentEmpId = newEmpId; currentEmpEmail = email;
          lockFieldsPermanently(currentEmpName, currentEmpEmail, currentEmpId); unlockActionButtons();
          showAlert("🎉 تم تسجيل هويتك وبصمة جهازك بنجاح!", "success");
        } else {
          showAlert("❌ فشل التسجيل: " + result.message, "error");
          nameInput.readOnly = false; emailInput.readOnly = false; regBtn.disabled = false; regBtn.innerText = "🔒 إعادة المحاولة";
        }
      } catch (error) {
        showAlert("فشل الاتصال بالخادم، تأكد من الانترنت", "error");
        nameInput.readOnly = false; emailInput.readOnly = false; regBtn.disabled = false; regBtn.innerText = "🔒 تثبيت الحساب نهائياً على هذا الهاتف";
      }
    }

    function unlockActionButtons() {
      var scanBtn = document.getElementById("scanBtn");
      var manualBtn = document.getElementById("manualSubmitBtn");
      var lockWarn = document.getElementById("lockWarning");
      if(scanBtn) scanBtn.disabled = false;
      if(manualBtn) manualBtn.disabled = false;
      if(lockWarn) lockWarn.style.display = "none";
    }

    function restoreWorkState() {
      var checkInTime = localStorage.getItem("check_in_time");
      var state = localStorage.getItem("attendance_state") || "OUT";
      if (state === "IN" && checkInTime) setWorkActive(parseInt(checkInTime, 10));
      else if (state === "OUT" && localStorage.getItem("last_checkout_duration")) setWorkCheckout(localStorage.getItem("last_checkout_duration"));
      else setWorkInactive();
    }
    
    // تسجيل الدخول (الضوء الأخضر وبدء العداد)
    function setWorkActive(startTime) {
      var dot = document.getElementById("statusDot");
      var txt = document.getElementById("statusText");
      if(dot) dot.className = "status-dot active";
      if(txt) txt.innerText = "تسجيل دخول";
      
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(function() {
        var diff = Date.now() - startTime;
        var h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
        safeSetText("timerDisplay", String(h).padStart(2,'0') + ":" + String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0'));
      }, 1000);
    }
    
    // تسجيل الخروج (الضوء الأزرق وتجميد العداد)
    function setWorkCheckout(durationStr) {
      var dot = document.getElementById("statusDot");
      if (dot) dot.className = "status-dot checkout"; // تطبيق اللون الأزرق
      
      var txt = document.getElementById("statusText");
      if (txt) txt.innerText = "تم تسجيل الخروج";
      
      // إيقاف العداد فوراً حتى لا يستمر بالعمل في الخلفية
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      
      // تجميد الرقم على الشاشة (منع عودته للصفر)
      if (durationStr && durationStr !== "00:00:00") {
        safeSetText("timerDisplay", durationStr);
      }
    }
    
    function setWorkInactive() {
      var dot = document.getElementById("statusDot");
      var txt = document.getElementById("statusText");
      if(dot) dot.className = "status-dot";
      if(txt) txt.innerText = "بانتظار التسجيل";
      if (timerInterval) clearInterval(timerInterval); safeSetText("timerDisplay", "00:00:00");
    }

    async function toggleCamera() {
      if (isCameraActive) { await stopCamera(); return; }
      if (typeof Html5Qrcode === "undefined") { showAlert("جاري تحميل الكاميرا...", "warning"); return; }
      var readerContainer = document.getElementById("reader-container");
      if(readerContainer) readerContainer.style.display = "block";
      var btn = document.getElementById("scanBtn"); 
      if(btn) { btn.innerText = "⏳ تشغيل الكاميرا..."; btn.disabled = true; }
      try {
        html5QrCode = new Html5Qrcode("reader");
        var devices = await Html5Qrcode.getCameras();
        var selectedId = devices && devices.length > 0 ? devices[devices.length - 1].id : null;
        await html5QrCode.start(selectedId ? selectedId : { facingMode: "environment" }, { fps: 10, qrbox: { width: 220, height: 220 } }, onScanSuccess, function(){});
        isCameraActive = true; 
        if(btn) { btn.innerText = "🛑 إيقاف الكاميرا"; btn.className = "btn-danger"; btn.disabled = false; }
      } catch (err) { showAlert("خطأ الكاميرا", "error"); await stopCamera(); }
    }
    
    async function stopCamera() {
      if (html5QrCode && isCameraActive) { try { await html5QrCode.stop(); html5QrCode.clear(); } catch (e) {} }
      isCameraActive = false; 
      var readerContainer = document.getElementById("reader-container");
      if(readerContainer) readerContainer.style.display = "none";
      var btn = document.getElementById("scanBtn"); 
      if(btn) { btn.innerText = "📷 تشغيل الكاميرا لمسح الرمز"; btn.className = "btn-primary"; btn.disabled = false; }
    }
    
    async function onScanSuccess(decodedText) { await stopCamera(); processAttendance(decodedText); }
    
    function handleManualQrSubmit() {
      var input = document.getElementById("manualQrInput");
      var val = input ? input.value.trim() : "";
      if (!val) { showAlert("يرجى إدخال الكود", "warning"); return; }
      processAttendance(val);
    }

    // دوال جلب IP و GPS
    async function fetchPublicIp() { try { var r = await fetch("https://api.ipify.org?format=json"); var j = await r.json(); return j.ip; } catch(e){ return ""; } }
    function getGeoLocation() { return new Promise(function(resolve) { if(!navigator.geolocation) { resolve({lat:0, lng:0}); } else { navigator.geolocation.getCurrentPosition(function(p){ resolve({lat:p.coords.latitude, lng:p.coords.longitude}); }, function(e){ resolve({lat:0, lng:0}); }, {timeout: 8000}); } }); }

    async function processAttendance(qrText) {
      if (!currentEmpId || !currentEmpEmail) { showAlert("يرجى تثبيت الهوية أولاً", "error"); return; }

      // فحص فترة السماح (تعمل فقط إذا تم التحديث بعد مسح ناجح)
      var lastScanTime = parseInt(localStorage.getItem("last_scan_time") || "0", 10);
      var now = Date.now();
      if (now - lastScanTime < TOLERANCE_MS) {
        showAlert("⏳ يرجى الانتظار " + Math.ceil((TOLERANCE_MS - (now - lastScanTime)) / 1000) + " ثانية.", "warning"); return;
      }

      safeSetText("scannedResultText", qrText);
      var resultBox = document.getElementById("scannedResultBox");
      if(resultBox) resultBox.style.display = "block";
      showAlert("⏳ جاري التحقق من الموقع، الهوية، وتسجيل الحركة...", "warning");

      var coords = await getGeoLocation();
      var clientIp = await fetchPublicIp();
      var currentState = localStorage.getItem("attendance_state") || "OUT";
      var newAction = currentState === "OUT" ? "CHECK_IN" : "CHECK_OUT";

      var payload = { action: "RECORD_ATTENDANCE", employeeId: currentEmpId, employeeName: currentEmpName, employeeEmail: currentEmpEmail, deviceFingerprint: currentDeviceId, qrData: qrText, latitude: coords.lat, longitude: coords.lng, clientIp: clientIp, timestamp: new Date().toISOString() };

      try {
        var response = await fetch(SCRIPT_URL, { method: "POST", mode: "cors", body: JSON.stringify(payload), headers: { "Content-Type": "text/plain;charset=utf-8" } });
        var result = JSON.parse(await response.text());

        if (result.status === "SUCCESS" || result.status === "OK") { 
          // 🔴 تفعيل Tolerance Time (حفظ الوقت) فقط عند النجاح
          localStorage.setItem("last_scan_time", Date.now().toString());
          
          var verifiedAction = result.action || newAction;
          
          if (verifiedAction === "CHECK_IN") {
            localStorage.setItem("attendance_state", "IN"); 
            localStorage.setItem("check_in_time", Date.now().toString());
            setWorkActive(Date.now()); 
            showAlert("✅ تم تسجيل الدخول بنجاح!", "success");
            
          } else {
            // التقاط الوقت المعروض حالياً على الشاشة وتجميده فوراً (الانصراف)
            var timerDisplay = document.getElementById("timerDisplay");
            var frozenDisplayTime = timerDisplay ? timerDisplay.innerText : "00:00:00";
            var totalHours = result.totalHours || "0.00";
            
            localStorage.setItem("attendance_state", "OUT"); 
            localStorage.setItem("last_checkout_duration", frozenDisplayTime);
            
            setWorkCheckout(frozenDisplayTime); 
            showAlert("🚪 تم تسجيل الخروج بنجاح! (المدة: " + totalHours + " ساعة)", "success");
          }
        } else {
          // لم يتم تحديث last_scan_time، مما يتيح للمستخدم إعادة المحاولة فورا
          showAlert("❌ " + (result.message || "فشل التحقق"), "error");
        }
      } catch (error) {
        showAlert("فشل الاتصال بالخادم، قد يكون بسبب ضعف الشبكة", "error");
      }
    }
    </script>
  
</body>
</html>
