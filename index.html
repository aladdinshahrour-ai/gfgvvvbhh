<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام الحضور والانصراف الذكي</title>
  
  <!-- مكتبة قراءة QR Code عبر الكاميرا -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 14px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    /* عرض ID الموظف */
    .id-badge-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px dashed var(--accent);
      margin-bottom: 12px;
    }

    .id-badge {
      font-weight: 700;
      color: #60a5fa;
      letter-spacing: 1px;
      font-family: monospace;
      font-size: 1rem;
    }

    /* لوحة الحالة والتايمر */
    .status-panel {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #64748b;
      transition: all 0.3s ease;
    }

    .status-dot.active {
      background-color: var(--success);
      box-shadow: 0 0 14px var(--success);
    }

    .timer-display {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }

    /* شاشة الكاميرا */
    #reader-container {
      width: 100%;
      min-height: 250px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: none;
    }

    #reader {
      width: 100% !important;
    }

    /* خط فاصل أنيق */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 16px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider:not(:empty)::before {
      margin-left: .5em;
    }

    .divider:not(:empty)::after {
      margin-right: .5em;
    }

    /* صندوق طباعة وعرض نتيجة الرمز المقروء/المدخل */
    .scanned-result-box {
      background: #0f172a;
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .scanned-result-title {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: bold;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .scanned-result-text {
      font-family: monospace;
      font-size: 0.85rem;
      color: #e2e8f0;
      word-break: break-all;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-submit { background-color: #2563eb; color: white; }
    .btn-primary { background-color: var(--accent); color: white; }
    .btn-success { background-color: #16a34a; color: white; }
    .btn-danger { background-color: var(--danger); color: white; }

    /* التنبيهات */
    .alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      word-break: break-word;
      display: none;
    }

    .alert-success { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
    .alert-error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; }
    .alert-warning { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid #eab308; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- تنبيه HTTPS في حال فتح الرابط بدون تشفير -->
    <div id="httpsWarning" class="alert alert-warning">
      ⚠️ الكاميرا تتطلب تشغيل الصفحة عبر رابط آمن يبدأ بـ <b>HTTPS</b> (مثل GitHub Pages).
    </div>

    <!-- نموذج بيانات الموظف مع زر الحفظ -->
    <form id="employeeForm" class="card" onsubmit="handleFormSubmit(event)">
      <h1>بيانات الموظف</h1>
      
      <!-- إظهار الرمز المولد للموظف -->
      <div class="id-badge-container">
        <span style="font-size: 0.85rem; color: var(--text-muted);">الرمز المولد (ID):</span>
        <span class="id-badge" id="empIdDisplay">لم يتم التوليد بعد</span>
      </div>

      <div class="form-group">
        <label for="empName">اسم الموظف</label>
        <input type="text" id="empName" placeholder="أدخل اسمك الكامل" required>
      </div>

      <div class="form-group">
        <label for="empTitle">المسمى الوظيفي</label>
        <input type="text" id="empTitle" placeholder="مثال: مهندس برمجيات / محاسب" required>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        💾 حفظ وتأكيد البيانات (Submit)
      </button>
    </form>

    <!-- لوحة التايمر ومؤشر الدخول -->
    <div class="card status-panel">
      <div class="status-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">خارج الدوام</span>
      </div>
      <div class="timer-display" id="timerDisplay">00:00:00</div>
    </div>

    <!-- رسائل التنبيه والخطأ -->
    <div id="alertBox" class="alert"></div>

    <!-- بطاقة خيارات تسجيل الحضور والانصراف (كاميرا + إدخال يدوي) -->
    <div class="card">
      <h2 style="font-size: 1rem; margin-bottom: 12px; text-align: center; color: var(--text-muted);">تسجيل الحضور / الانصراف</h2>

      <!-- الخيار 1: مسح بالكاميرا -->
      <div id="reader-container">
        <div id="reader"></div>
      </div>
      
      <button id="scanBtn" class="btn-primary" onclick="toggleCamera()" disabled>
        📷 تشغيل الكاميرا لمسح الرمز
      </button>

      <!-- فاصل بين الطريقتين -->
      <div class="divider">أو إدخال الرمز يدوياً</div>

      <!-- الخيار 2: إدخال الكود يدويًا -->
      <div class="form-group" style="margin-bottom: 8px;">
        <input type="text" id="manualQrInput" placeholder="أدخل أو الصق رابط / كود الـ QR هنا" dir="ltr" style="text-align: left;">
      </div>

      <button id="manualSubmitBtn" class="btn-success" onclick="handleManualQrSubmit()" disabled>
        ✍️ تسجيل الحضور عبر الكود المدخل
      </button>

      <!-- صندوق طباعة وعرض نتيجة الـ QR الممسوح أو المدخل -->
      <div id="scannedResultBox" class="scanned-result-box">
        <div class="scanned-result-title">
          <span>🔍 الرمز المعتمد (QR Data):</span>
        </div>
        <div id="scannedResultText" class="scanned-result-text">---</div>
      </div>

      <div id="lockWarning" style="font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-top: 10px;">
        (يرجى الضغط على زر حفظ وتأكيد البيانات أولاً لتفعيل خيارات التسجيل)
      </div>
    </div>
  </div>

  <script>
    // ========================================================
    // 1. رابط الـ Google Apps Script الخاص بك
    // ========================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjW72L9c19qNFMVTD9Xc4TcBW7mqCsJlu3uvsbNM5R4kZe3BpviswUDNcm-9Lvl-wn/exec";

    // العناصر والمتغيرات
    const empNameInput = document.getElementById("empName");
    const empTitleInput = document.getElementById("empTitle");
    const empIdDisplay = document.getElementById("empIdDisplay");
    const manualQrInput = document.getElementById("manualQrInput");
    const manualSubmitBtn = document.getElementById("manualSubmitBtn");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const timerDisplay = document.getElementById("timerDisplay");
    const alertBox = document.getElementById("alertBox");
    const scanBtn = document.getElementById("scanBtn");
    const lockWarning = document.getElementById("lockWarning");
    const readerContainer = document.getElementById("reader-container");
    const scannedResultBox = document.getElementById("scannedResultBox");
    const scannedResultText = document.getElementById("scannedResultText");

    let timerInterval = null;
    let html5QrCode = null;
    let isCameraActive = false;
    let currentEmpId = "";

    // ========================================================
    // 2. استرجاع البيانات المحفوظة من الكاش (localStorage)
    // ========================================================
    window.addEventListener("DOMContentLoaded", () => {
      if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        document.getElementById("httpsWarning").style.display = "block";
      }

      const savedId = localStorage.getItem("emp_id");
      const savedName = localStorage.getItem("emp_name");
      const savedTitle = localStorage.getItem("emp_title");

      if (savedId && savedName && savedTitle) {
        currentEmpId = savedId;
        empIdDisplay.innerText = currentEmpId;
        empNameInput.value = savedName;
        empTitleInput.value = savedTitle;
        unlockActionButtons();
      }

      const lastQr = localStorage.getItem("last_scanned_qr");
      if (lastQr) {
        displayProcessedQr(lastQr);
        manualQrInput.value = lastQr;
      }

      restoreWorkState();
    });

    // ========================================================
    // 3. حفظ بيانات الموظف والرمز المولد في الكاش
    // ========================================================
    function handleFormSubmit(event) {
      event.preventDefault();

      const name = empNameInput.value.trim();
      const title = empTitleInput.value.trim();

      if (!name || !title) {
        showAlert("يرجى ملء كافة الحقول بشكل صحيح", "error");
        return;
      }

      if (!currentEmpId) {
        currentEmpId = "EMP-" + Math.floor(100000 + Math.random() * 900000);
      }

      localStorage.setItem("emp_id", currentEmpId);
      localStorage.setItem("emp_name", name);
      localStorage.setItem("emp_title", title);

      empIdDisplay.innerText = currentEmpId;
      showAlert(`تم حفظ البيانات وتثبيت الرمز (${currentEmpId}) بنجاح!`, "success");
      
      unlockActionButtons();
    }

    function unlockActionButtons() {
      scanBtn.disabled = false;
      manualSubmitBtn.disabled = false;
      lockWarning.style.display = "none";
    }

    // ========================================================
    // 4. إدارة التايمر والمؤشر الضوئي
    // ========================================================
    function restoreWorkState() {
      const checkInTime = localStorage.getItem("check_in_time");
      if (checkInTime) {
        setWorkActive(parseInt(checkInTime, 10));
      } else {
        setWorkInactive();
      }
    }

    function setWorkActive(startTime) {
      statusDot.classList.add("active");
      statusText.innerText = "داخل الدوام (جاري الاحتساب)";

      if (timerInterval) clearInterval(timerInterval);

      const updateTimer = () => {
        const diff = Date.now() - startTime;
        const hours = Math.floor(diff / 3600000);
        const minutes = Math.floor((diff % 3600000) / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);

        timerDisplay.innerText = 
          String(hours).padStart(2, '0') + ":" +
          String(minutes).padStart(2, '0') + ":" +
          String(seconds).padStart(2, '0');
      };

      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
    }

    function setWorkInactive() {
      statusDot.classList.remove("active");
      statusText.innerText = "خارج الدوام";
      if (timerInterval) clearInterval(timerInterval);
      timerDisplay.innerText = "00:00:00";
    }

    function displayProcessedQr(text) {
      scannedResultText.innerText = text;
      scannedResultBox.style.display = "block";
    }

    // ========================================================
    // 5. مسح الكاميرا
    // ========================================================
    async function toggleCamera() {
      if (isCameraActive) {
        await stopCamera();
        return;
      }

      if (!currentEmpId) {
        showAlert("يرجى الضغط على زر حفظ وتأكيد البيانات أولاً", "error");
        return;
      }

      readerContainer.style.display = "block";
      scanBtn.innerText = "⏳ جاري تشغيل الكاميرا...";
      scanBtn.disabled = true;

      try {
        html5QrCode = new Html5Qrcode("reader");

        const devices = await Html5Qrcode.getCameras();
        let selectedCameraId = null;

        if (devices && devices.length > 0) {
          const backCam = devices.find(d => 
            d.label.toLowerCase().includes("back") || 
            d.label.toLowerCase().includes("rear") || 
            d.label.toLowerCase().includes("environment")
          );
          selectedCameraId = backCam ? backCam.id : devices[devices.length - 1].id;
        }

        const cameraConfig = selectedCameraId ? selectedCameraId : { facingMode: "environment" };

        await html5QrCode.start(
          cameraConfig,
          {
            fps: 10,
            qrbox: { width: 220, height: 220 },
            aspectRatio: 1.0
          },
          onScanSuccess,
          () => {}
        );

        isCameraActive = true;
        scanBtn.innerText = "🛑 إيقاف الكاميرا";
        scanBtn.className = "btn-danger";
        scanBtn.disabled = false;

      } catch (err) {
        console.error("Camera Error:", err);
        showAlert("خطأ في الكاميرا: " + (err.message || "تأكد من إذن الكاميرا وعمل HTTPS"), "error");
        await stopCamera();
      }
    }

    async function stopCamera() {
      if (html5QrCode && isCameraActive) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
        } catch (e) {
          console.warn("Cleanup error:", e);
        }
      }
      isCameraActive = false;
      readerContainer.style.display = "none";
      scanBtn.innerText = "📷 تشغيل الكاميرا لمسح الرمز";
      scanBtn.className = "btn-primary";
      scanBtn.disabled = false;
    }

    async function onScanSuccess(decodedText) {
      await stopCamera();
      processAttendanceRequest(decodedText);
    }

    // ========================================================
    // 6. الإدخال اليدوي لكود الـ QR
    // ========================================================
    function handleManualQrSubmit() {
      const manualCode = manualQrInput.value.trim();
      if (!manualCode) {
        showAlert("يرجى كتابة أو لصق كود الـ QR في الخانة أولاً", "warning");
        return;
      }
      processAttendanceRequest(manualCode);
    }

    // ========================================================
    // 7. الدالة الموحدة لإرسال الطلب (كاميرا أو يدوي) للخادم
    // ========================================================
    async function processAttendanceRequest(qrText) {
      displayProcessedQr(qrText);
      localStorage.setItem("last_scanned_qr", qrText);

      showAlert("جاري معالجة الطلب وتسجيل الحركة في الجدول...", "success");

      const payload = {
        employeeId: localStorage.getItem("emp_id"),
        employeeName: localStorage.getItem("emp_name"),
        jobTitle: localStorage.getItem("emp_title"),
        qrData: qrText,
        timestamp: new Date().toISOString()
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "cors",
          redirect: "follow",
          headers: { 
            "Content-Type": "text/plain;charset=utf-8" 
          },
          body: JSON.stringify(payload)
        });

        const responseText = await response.text();
        let result;
        try {
          result = JSON.parse(responseText);
        } catch(e) {
          throw new Error("رد غير متوقع من الخادم: " + responseText.substring(0, 80));
        }

        if (result.status === "SUCCESS") {
          if (result.action === "CHECK_IN") {
            const now = Date.now();
            localStorage.setItem("check_in_time", now.toString());
            setWorkActive(now);
            showAlert(`تم تسجيل الدخول بنجاح! مرحباً ${payload.employeeName}`, "success");
          } else if (result.action === "CHECK_OUT") {
            localStorage.removeItem("check_in_time");
            setWorkInactive();
            showAlert(`تم تسجيل الانصراف. ساعات العمل اليوم: ${result.totalHours || "0"} ساعة.`, "success");
          }
        } else {
          showAlert(result.message || "حدث خطأ أثناء معالجة الطلب في الخادم", "error");
        }
      } catch (error) {
        console.error("Fetch Error:", error);
        showAlert("فشل الاتصال: " + (error.message || "تحقق من اتصالك بالإنترنت"), "error");
      }
    }

    function showAlert(msg, type) {
      alertBox.innerText = msg;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = "block";
      setTimeout(() => {
        alertBox.style.display = "none";
      }, 7000);
    }
  </script>
</body>
</html>
